[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextaaa"
version = "0.3.0"
description = "Give Me The Next AAA Title: hit metric (Part A) and the generate-score-refine designer (Part B)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# pyarrow makes the cache ~5x faster to read; without it we fall back to pickle.
fast = ["pyarrow>=14"]
# v2: exact GLOSH outlier scores for HDBSCAN (falls back to an approximation without it).
v2 = ["hdbscan>=0.8.33"]
# Part B: LLM clients; TabPFN is an optional judge candidate.
partb = ["openai>=1.55.3"]
tabpfn = ["tabpfn>=2.0"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
